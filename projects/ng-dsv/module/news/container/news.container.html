<app-news-card [news]="news()">
    <dsv-button
        class="update-button"
        color="secondary"
        variant="outlined"
        icon="ri-share-line"
        (callback)="doShare(news()!)"
    />
    @if (isAdmin()) {
        <dsv-button
            class="update-button"
            color="secondary"
            variant="outlined"
            icon="ri-tools-line"
            [routerLink]="'/news/update/' + news()?.id"
        />
    }
</app-news-card>
