<dsv-card [routerLink]="'/news/' + news()?.id">
    @if (news()?.image) {
        <dsv-file-show url="/api/" [src]="news()?.image ?? ''" />
    }
    <h2 [class.error]="!news()?.active">{{ news()?.title }}</h2>
    <span class="subtitle">Le {{ news()?.creationDate! | formatDate: true }}</span>
    <dsv-markdown-container [data]="news()?.resume" />
    <a [href]="'/news/' + news()?.id" dsvLink>Lire la suite...</a>
</dsv-card>
