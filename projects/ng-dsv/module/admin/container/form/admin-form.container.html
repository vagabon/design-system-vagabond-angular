<dsv-card>
    <dsv-card-header>
        <h2>
            {{ adminService.data().id ? 'Modification' : 'Ajout' }}
        </h2>
    </dsv-card-header>
    <dsv-admin-form
        [data]="adminService.data()"
        [formConf]="tabConfig()?.form!"
        [urlBack]="'/admin/' + tab()"
        (callback)="sendForm($event)"
    />
</dsv-card>
