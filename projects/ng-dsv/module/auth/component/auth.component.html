<button
    id="google-signin-button"
    [class.hidden]="!authService.isRefreshTokenLoaded() || authService.userConnected() !== null"
></button>

@if (authService.userConnected()) {
    <ng-content />
    <a href="/profil" dsvLink>
        <img [src]="authService.userConnected()?.avatar" alt="Profile" referrerpolicy="no-referrer" />
    </a>
    <dsv-modal-button modalName="logout" color="secondary" variant="outlined" icon="ri-logout-box-line" />
    <dsv-modal-alert
        id="logout"
        titleText="Déconnexion"
        text="Voulez-vous vraiment vous déconnecter ?"
        button="Oui"
        buttonClose="Non"
        (callback)="logout()"
    ></dsv-modal-alert>
}
