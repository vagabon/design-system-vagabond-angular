<div #checkbox (click)="triggerCheckbox()">
    @if (getSignal()) {
        <dsv-form-signal-label
            [name]="fieldName()"
            [label]="label() ?? fieldName()"
            [signal]="getSignal()()"
            [show]="withLabel()"
        />
        <div>
            <input
                type="checkbox"
                [id]="fieldName()"
                class="form-control"
                [class.error]="isError()"
                [formField]="getBooleanSignal()"
                (click)="$event.stopPropagation()"
                (change)="doChange()"
            />
        </div>
    }
</div>
