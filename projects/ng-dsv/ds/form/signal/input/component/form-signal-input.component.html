<div>
    @if (getSignal()) {
        @if (withLabel()) {
            <dsv-form-signal-label
                [name]="fieldName()"
                [label]="label() ?? fieldName()"
                [signal]="getSignal()()"
            />
        }
        @if (type() === 'textarea') {
            <textarea
                #input
                [id]="fieldName()"
                [formField]="getSignal()"
                [placeholder]="placeholder()"
                class="form-control"
                (blur)="doOnSend()"
            ></textarea>
        } @else {
            <input
                #input
                [type]="type()"
                [id]="fieldName()"
                class="form-control"
                [class.error]="isError()"
                [formField]="getSignal()"
                [placeholder]="placeholder() | translate"
                [class.icon]="icon()"
                (blur)="doOnSend()"
                (change)="doChange()"
                (keydown.enter)="doOnSend()"
            />
        }
        @if (icon()) {
            <i [class]="icon()"></i>
        }
        @if (withError()) {
            <dsv-form-signal-error [errors]="getSignal()().errors()" [isTouched]="isTouched()" />
        }
    }
</div>
