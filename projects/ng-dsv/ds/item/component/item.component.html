<a [href]="this.url() ?? '#'" class="text" (click)="doClick($event)" [class.small]="small()">
    <span>
        @if (icon()) {
            <i class="ri-{{ icon() }}-line"></i>
        }
        {{ text() }}
    </span>
    @if (nb() >= 0) {
        <dsv-chip color="secondary">{{ nb() }}</dsv-chip>
    }
</a>
<ng-content></ng-content>
