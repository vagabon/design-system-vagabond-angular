<dsv-modal [id]="id()" [titleText]="titleText()">
    {{ text() }}
    <div class="modal-footer">
        @if (buttonClose()) {
            <dsv-button (callback)="doClickClose()" color="secondary" variant="outlined">
                {{ buttonClose()! | translate }}
            </dsv-button>
        }
        <dsv-button (callback)="doClick()" color="secondary">
            {{ button() | translate }}
        </dsv-button>
    </div>
</dsv-modal>
