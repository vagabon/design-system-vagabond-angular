<a class="dsv-accordion-header" [class.disabled]="!hasContent()" (click)="doToogle()">
    <div>
        {{ titleText() | translate }}
        <ng-content select=".dsv-accordion-header"></ng-content>
    </div>
    @if (isOpen() === true) {
        <i class="ri-arrow-up-s-line" [class.disabled]="!hasContent()"></i>
    } @else {
        <i class="ri-arrow-down-s-line" [class.disabled]="!hasContent()"></i>
    }
</a>
<div class="dsv-accordion-text" [class.open]="isOpen() === true">
    <ng-content #accordionContent></ng-content>
</div>
